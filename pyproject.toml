[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaicode"
version = "2.2.0"
description = "A terminal AI coding assistant supporting multiple AI providers"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Kai Cyrus", email = "me@kaicyrus.com"}
]
keywords = ["ai", "coding", "assistant", "terminal", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Terminals",
]
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7.0,<15.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyyaml>=6.0,<7.0",
    "click>=8.1.7,<9.0",
    "openai>=0.34.0,<1.0.0",
    "openai>=1.40.0,<3.0.0",
    "groq>=0.9.0,<1.0.0",
    "prompt_toolkit>=3.0.47,<4.0.0",
    "pygments>=2.18.0,<3.0.0",
    "pyautogui>=0.9.54,<1.0.0",
]

[project.optional-dependencies]
cyrusago = ["cyrusago"]
dev = [
    "build>=1.2.1",
    "coverage>=7.6.0",
    "pip-audit>=2.7.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "safety>=3.8.1",
    "twine>=6.2.0",
]

[project.scripts]
kaicode = "kaicode.main:main"

[project.urls]
Homepage = "https://github.com/kaicyrusdgreat/kaicode"
Repository = "https://github.com/kaicyrusdgreat/kaicode"

[tool.setuptools.packages.find]
where = ["."]
include = ["kaicode*"]

[tool.pytest.ini_options]
addopts = "--cov=kaicode --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kaicode"]

[tool.coverage.report]
fail_under = 14
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
