name: CI

on:
  push:
  pull_request:

jobs:
  test-build-audit:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Compile validation
        run: python -m compileall kaicode tests

      - name: Formatting check
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Unit tests with coverage
        run: python -m pytest

      - name: Dependency conflict check
        run: python -m pip check

      - name: Build package
        run: python -m build

      - name: Check package metadata
        run: python -m twine check dist/*

      - name: Wheel install smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          kaicode --version
          kaicode --help
          python scripts/install_smoke.py

      - name: Dependency vulnerability scan
        run: python -m pip_audit

      - name: Safety vulnerability scan
        run: python -m safety check --full-report

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.python-version }}
          path: dist/*

  install-smoke:
    name: Install smoke ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify command
        run: |
          kaicode --version
          kaicode --help
          python scripts/install_smoke.py

      - name: Verify uninstall
        shell: bash
        run: |
          python -m pip uninstall -y kaicode
          if command -v kaicode >/dev/null 2>&1; then
            echo "kaicode command still present after uninstall"
            exit 1
          fi
