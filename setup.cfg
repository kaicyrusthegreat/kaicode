[metadata]
name = kaicode
version = 1.2.1
description = A terminal AI coding assistant supporting multiple AI providers
long_description = file: README.md
long_description_content_type = text/markdown
author = Kai Cyrus
author_email = me@kaicyrus.com
license = MIT
url = https://github.com/kaicyrus/kaicode
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development
    Topic :: Terminals

[options]
python_requires = >=3.9
packages = find:
install_requires =
    rich>=13.7.0
    httpx>=0.27.0
    pyyaml>=6.0
    click>=8.1.7
    openai>=0.34.0
    openai>=1.40.0
    groq>=0.9.0
    gitpython>=3.1.43
    prompt_toolkit>=3.0.47
    pygments>=2.18.0
    pathspec>=0.12.1

[options.entry_points]
console_scripts =
    kaicode = kaicode.main:main

[options.packages.find]
include = kaicode*
